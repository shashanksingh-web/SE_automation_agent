# Production-oriented stack: redis (Celery's broker) + web (gunicorn/Django) +
# celery_worker + celery_beat. Scoped to just this backend repo -- the frontend
# ("New Lead gen model") is a separate project, deployed independently, same as today.
#
# Secrets: NOT baked into the image -- every service reads them from .env at runtime
# via env_file. Copy .env.docker.example to .env and fill in real values before
# `docker compose up`; see that file for what's required vs optional.
#
# Data persistence: output/, logs/, and the operator-managed CSV/config files
# (DC_RAnk.csv, "config and parameter /", the AOP CSV, pitch_config/) are bind mounts
# back to the host, not baked into the image -- a rebuild or container restart never
# loses them, and the admin CSV-upload endpoints keep writing to the same real files an
# operator can inspect directly on the host.
#
# db.sqlite3 is DELIBERATELY NOT a bind mount (changed 2026-09-19, real incident) -- it
# lives in the `sqlite_data` named volume instead. SQLite's WAL mode requires reliable
# shared-memory (mmap) semantics between every process touching the file; Docker
# Desktop/Colima's bind-mount bridge (virtiofs/gRPC-FUSE) between macOS and the Linux
# VM does not reliably provide that. Confirmed live: real database corruption happened
# TWICE in one session from this exact setup -- once from a host-side Python process
# writing to the bind-mounted file while the container also had it open, and again from
# a plain host-side `sqlite3 -readonly` READ while the container was mid-write -- so
# this isn't a "don't write from the host" discipline problem, it's the bind mount
# itself being unsafe for concurrent access of ANY kind while a WAL-mode SQLite file
# sits on it. A named volume lives natively inside the Linux VM's own filesystem, with
# no macOS-side path at all, which makes that whole class of corruption structurally
# impossible rather than something to remember not to do. Tradeoff: `sqlite3
# db.sqlite3` from the host no longer works for ad-hoc inspection -- use `docker exec
# <web container> sqlite3 /app/db_data/db.sqlite3 ...` instead (see DOCKER.md).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      # Read by config/settings.py -- overrides the default BASE_DIR/db.sqlite3 path
      # (which stays the default for local non-Docker dev) so the DB lives in the
      # sqlite_data named volume below instead of a bind mount. See this file's own
      # top comment for why.
      SQLITE_DB_PATH: /app/db_data/db.sqlite3
    ports:
      - "8000:8000"
    volumes: &app_data_volumes
      - sqlite_data:/app/db_data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./DC_RAnk.csv:/app/DC_RAnk.csv
      - "./config and parameter :/app/config and parameter "
      - "./Niyojan Q2-FY_26_27 Dashboard - Planning.csv:/app/Niyojan Q2-FY_26_27 Dashboard - Planning.csv"
      - ./pitch_config:/app/pitch_config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_worker:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      SQLITE_DB_PATH: /app/db_data/db.sqlite3
    volumes: *app_data_volumes
    # --pool=solo: see Dockerfile's own comment -- a real, confirmed billiard/Python
    # 3.14/macOS bug this project hit locally; kept as the safe default here too since
    # it's untested whether Linux + Python 3.12 + prefork would avoid it, and this
    # app's 3 scheduled/on-demand tasks are low-frequency enough that solo's lack of
    # parallelism costs nothing real.
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--pool=solo"]
    # No process-level healthcheck: `celery inspect ping` can itself block for the
    # duration of a long-running task under --pool=solo (the same process handles both
    # the task and inspect requests), so a strict healthcheck here would misreport a
    # legitimately busy worker (a real state-scope generation has taken ~750s) as
    # unhealthy and trigger a restart mid-task. Rely on `docker compose logs
    # celery_worker` / Redis's own connection tracking for operational visibility
    # instead.

  celery_beat:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      SQLITE_DB_PATH: /app/db_data/db.sqlite3
    volumes: *app_data_volumes
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]

volumes:
  redis_data:
  sqlite_data:
